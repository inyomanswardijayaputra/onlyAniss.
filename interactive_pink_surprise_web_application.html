<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuma Buat Anis</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FFF9F5',
                        softpink: '#FFE5EC',
                        mediumpink: '#FFB3C6',
                        hotpink: '#FF85A1',
                        deepberry: '#6B3042',
                        accentgold: '#F7C59F'
                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        caveat: ['Caveat', 'cursive']
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 133, 161, 0.4); }
            50% { shadow: 0 0 30px rgba(255, 133, 161, 0.8); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        @keyframes fallingSakura {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg) translateX(100px); opacity: 0.2; }
        }
        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-float { animation: float 4s ease-in-out infinite; }
        .animate-pulse-glow { animation: pulseGlow 2s infinite; }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        .animate-pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .sakura-petal {
            position: fixed;
            top: -10%;
            pointer-events: none;
            z-index: 10;
            user-select: none;
            animation: fallingSakura linear infinite;
        }

        .envelope-wrapper {
            perspective: 1000px;
        }
        .envelope {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
        }
        .envelope-flap {
            transform-origin: top center;
            transition: transform 0.6s ease, z-index 0.2s ease 0.3s;
        }
        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }
        .letter-paper {
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
        }
        .envelope.open .letter-paper {
            transform: translateY(-140px) scale(1.03);
            z-index: 20;
        }

        /* Paper texture lines */
        .notebook-lines {
            background-image: repeating-linear-gradient(transparent, transparent 27px, #fbcfe8 28px);
            line-height: 28px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #ffe5ec;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff85a1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-cream via-softpink to-mediumpink min-h-screen font-fredoka text-deepberry flex flex-col items-center justify-center p-3 sm:p-6 overflow-x-hidden relative">

    <!-- Background Falling Flowers Container -->
    <div id="sakura-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Music Control Float Button -->
    <div class="fixed top-4 right-4 z-50">
        <button id="music-toggle" onclick="toggleMusic()" class="bg-white/90 backdrop-blur-md border-2 border-hotpink/40 text-hotpink hover:bg-hotpink hover:text-white transition-all duration-300 p-3 rounded-full shadow-lg flex items-center gap-2 group">
            <i id="music-icon" class="fas fa-music text-lg animate-spin" style="animation-duration: 4s;"></i>
            <span id="music-text" class="text-xs font-semibold max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-300 whitespace-nowrap pl-0 group-hover:pl-1">Putar Musik 🎵</span>
        </button>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="w-full max-w-md md:max-w-lg z-10 my-auto">

        <section id="phase-1" class="bg-white/80 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-2xl border-4 border-white animate-pop-in relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-24 h-24 bg-mediumpink/30 rounded-full blur-xl pointer-events-none"></div>
            
            <!-- Header -->
            <div class="text-center mb-6">
                <div class="inline-block bg-softpink text-hotpink px-4 py-1 rounded-full text-xs sm:text-sm font-bold tracking-wider mb-2 border border-hotpink/20 shadow-sm">
                    ✨ SECRET DOORWAY ✨
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-deepberry flex items-center justify-center gap-2">
                    HALO, KAMU! <span class="inline-block animate-bounce">🌸</span>
                </h1>
                <p class="text-xs sm:text-sm text-deepberry/70 mt-1">Masukkan 3 Digit Angka NIM Terakhirmu yaa!</p>
            </div>

            <div id="pin-container" class="flex justify-center gap-3 sm:gap-4 mb-6">
                <div class="pin-slot w-12 h-14 sm:w-16 sm:h-20 bg-softpink/60 border-2 border-hotpink/40 rounded-2xl flex items-center justify-center text-2xl sm:text-3xl shadow-inner transition-all duration-200">
                    <span class="pin-dot hidden text-hotpink animate-pop-in">🌸</span>
                </div>
                <div class="pin-slot w-12 h-14 sm:w-16 sm:h-20 bg-softpink/60 border-2 border-hotpink/40 rounded-2xl flex items-center justify-center text-2xl sm:text-3xl shadow-inner transition-all duration-200">
                    <span class="pin-dot hidden text-hotpink animate-pop-in">🌸</span>
                </div>
                <div class="pin-slot w-12 h-14 sm:w-16 sm:h-20 bg-softpink/60 border-2 border-hotpink/40 rounded-2xl flex items-center justify-center text-2xl sm:text-3xl shadow-inner transition-all duration-200">
                    <span class="pin-dot hidden text-hotpink animate-pop-in">🌸</span>
                </div>
            </div>

            <div id="error-message" class="text-center text-xs sm:text-sm font-semibold text-rose-500 h-6 mb-2 opacity-0 transition-opacity duration-1000">
                Upps.. Ini khusus buat Anis aja ya!!
            </div>

            <div class="grid grid-cols-3 gap-3 sm:gap-4 max-w-xs mx-auto">
                <button onclick="pressKey('1')" class="keypad-btn bg-cream hover:bg-softpink active:scale-90 text-deepberry font-bold text-xl h-12 sm:h-14 rounded-2xl shadow-md border-b-4 border-mediumpink/60 transition-all flex items-center justify-center">1</button>
                <button onclick="pressKey('2')" class="keypad-btn bg-cream hover:bg-softpink active:scale-90 text-deepberry font-bold text-xl h-12 sm:h-14 rounded-2xl shadow-md border-b-4 border-mediumpink/60 transition-all flex items-center justify-center">2</button>
                <button onclick="pressKey('3')" class="keypad-btn bg-cream hover:bg-softpink active:scale-90 text-deepberry font-bold text-xl h-12 sm:h-14 rounded-2xl shadow-md border-b-4 border-mediumpink/60 transition-all flex items-center justify-center">3</button>
                <button onclick="pressKey('4')" class="keypad-btn bg-cream hover:bg-softpink active:scale-90 text-deepberry font-bold text-xl h-12 sm:h-14 rounded-2xl shadow-md border-b-4 border-mediumpink/60 transition-all flex items-center justify-center">4</button>
                <button onclick="pressKey('5')" class="keypad-btn bg-cream hover:bg-softpink active:scale-90 text-deepberry font-bold text-xl h-12 sm:h-14 rounded-2xl shadow-md border-b-4 border-mediumpink/60 transition-all flex items-center justify-center">5</button>
                <button onclick="pressKey('6')" class="keypad-btn bg-cream hover:bg-softpink active:scale-90 text-deepberry font-bold text-xl h-12 sm:h-14 rounded-2xl shadow-md border-b-4 border-mediumpink/60 transition-all flex items-center justify-center">6</button>
                <button onclick="pressKey('7')" class="keypad-btn bg-cream hover:bg-softpink active:scale-90 text-deepberry font-bold text-xl h-12 sm:h-14 rounded-2xl shadow-md border-b-4 border-mediumpink/60 transition-all flex items-center justify-center">7</button>
                <button onclick="pressKey('8')" class="keypad-btn bg-cream hover:bg-softpink active:scale-90 text-deepberry font-bold text-xl h-12 sm:h-14 rounded-2xl shadow-md border-b-4 border-mediumpink/60 transition-all flex items-center justify-center">8</button>
                <button onclick="pressKey('9')" class="keypad-btn bg-cream hover:bg-softpink active:scale-90 text-deepberry font-bold text-xl h-12 sm:h-14 rounded-2xl shadow-md border-b-4 border-mediumpink/60 transition-all flex items-center justify-center">9</button>
                
                <button onclick="clearPin()" class="bg-rose-100 hover:bg-rose-200 active:scale-90 text-rose-600 font-bold text-sm h-12 sm:h-14 rounded-2xl shadow-md border-b-4 border-rose-300 transition-all flex items-center justify-center">
                    <i class="fas fa-backspace text-lg"></i>
                </button>
                <button onclick="pressKey('0')" class="keypad-btn bg-cream hover:bg-softpink active:scale-90 text-deepberry font-bold text-xl h-12 sm:h-14 rounded-2xl shadow-md border-b-4 border-mediumpink/60 transition-all flex items-center justify-center">0</button>
                <button onclick="submitPin()" class="bg-hotpink hover:bg-rose-500 active:scale-90 text-white font-bold text-sm h-12 sm:h-14 rounded-2xl shadow-md border-b-4 border-rose-700 transition-all flex items-center justify-center gap-1">
                    OK <i class="fas fa-heart text-xs"></i>
                </button>
            </div>
        </section>

        <section id="phase-2" class="hidden flex-col items-center justify-center text-center">
            
            <!-- Banner Announcement -->
            <div class="mb-6 animate-pop-in">
                <span class="bg-white/90 backdrop-blur-md text-hotpink border-2 border-hotpink font-bold px-5 py-2 rounded-full text-sm sm:text-base shadow-lg inline-flex items-center gap-2">
                   HAI ANIS!, SIAP BUAT KEJUTAN GA?
                </span>
            </div>

            <!-- Envelope Container -->
            <div class="envelope-wrapper my-4 cursor-pointer group" onclick="openEnvelope()">
                <div id="envelope-elem" class="envelope animate-float w-72 h-48 sm:w-80 sm:h-52 bg-hotpink rounded-b-3xl shadow-2xl relative border-4 border-white flex items-center justify-center">
                    
                    <!-- Envelope Flap (Top triangle) -->
                    <div class="envelope-flap absolute top-0 left-0 right-0 h-28 sm:h-32 bg-rose-400 rounded-t-xl z-20 border-t-4 border-x-4 border-white flex items-center justify-center" style="clip-path: polygon(0 0, 100% 0, 50% 100%);">
                    </div>

                    <!-- Heart Seal -->
                    <div id="envelope-seal" class="absolute z-30 w-12 h-12 bg-white rounded-full border-2 border-hotpink flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-300">
                        <i class="fas fa-heart text-2xl text-hotpink animate-pulse"></i>
                    </div>

                    <!-- Envelope Pocket Overlay -->
                    <div class="absolute inset-0 bg-hotpink/80 rounded-b-2xl z-10 pointer-events-none border-b-4 border-x-4 border-white" style="clip-path: polygon(0 40%, 50% 70%, 100% 40%, 100% 100%, 0 100%);"></div>

                    <!-- Hidden Letter Preview Inside -->
                    <div class="letter-paper absolute w-64 sm:w-72 h-40 bg-white rounded-xl shadow-md p-4 z-5 flex flex-col justify-center items-center text-center opacity-90 border border-softpink">
                        <i class="fas fa-sparkles text-hotpink text-2xl mb-1"></i>
                        <p class="font-caveat text-xl font-bold text-deepberry">Foto Spesial Buat Kamu...</p>
                    </div>

                </div>
            </div>

            <p class="mt-6 text-white font-bold text-sm sm:text-base bg-deepberry/40 backdrop-blur-sm px-4 py-1.5 rounded-full shadow-md animate-pulse">
                 Klik amplopnya yaa!!!
            </p>
        </section>

        <section id="phase-4" class="hidden animate-pop-in">
            <div class="bg-cream/95 backdrop-blur-md rounded-3xl p-5 sm:p-7 shadow-2xl border-4 border-white relative overflow-hidden">
    
                <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 w-28 h-7 bg-hotpink/40 backdrop-blur-sm rotate-[-2deg] border border-white/60 shadow-sm z-20"></div>

                <div class="flex flex-col items-center pt-2">
                    <div class="relative group cursor-pointer w-full flex justify-center" onclick="triggerSurpriseReaction()">
              
                        <div class="bg-white p-4 pt-4 pb-6 rounded-2xl shadow-2xl border border-pink-100 w-full max-w-xs sm:max-w-sm relative transform hover:rotate-1 transition-transform duration-300">
                      
                            <div class="absolute -top-3 -right-3 bg-yellow-300 text-yellow-900 text-xs font-bold px-3 py-1 rounded-full shadow-md z-10 rotate-12 flex items-center gap-1 border border-yellow-400">
                                <span>Meowww</span> 
                            </div>

                            <div class="w-full h-64 sm:h-72 bg-pink-100 rounded-xl overflow-hidden relative border-2 border-pink-50 flex items-center justify-center shadow-inner">
                                <!-- Aib Image Placeholder (Funny Expression Illustration/Avatar) -->
                                <img id="aib-image" src="Anis.png" alt="Foto Aib" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                                
                                <!-- Funny Watermark Badge -->
                                <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-md text-white text-[11px] px-2.5 py-1 rounded-lg font-mono flex items-center gap-1">
                                    Meoww
                                </div>
                            </div>

                            <!-- Polaroid Handwritten Sarcastic Caption -->
                            <div class="mt-4 text-center px-2">
                                <p class="font-caveat text-2xl sm:text-3xl font-bold text-hotpink leading-tight">
                                    FOTO TER-CANTIK
                                </p>
                                <p class="text-xs text-deepberry/70 font-semibold mt-1">
                                    (wkwkwk....)
                                </p>
                            </div>
                        </div>

                    </div>

                </div>

                <div class="mt-6 bg-white/80 rounded-2xl p-3 border border-pink-200 flex items-center justify-between shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-softpink flex items-center justify-center text-hotpink animate-spin" style="animation-duration: 6s;">
                            <i class="fas fa-compact-disc text-xl"></i>
                        </div>
                        <div>
                            <p class="text-[10px] text-deepberry/60">Playing special song for you</p>
                        </div>
                    </div>
                    <button onclick="toggleMusic()" class="text-hotpink hover:text-rose-600 p-2 text-xl transition-transform active:scale-90">
                        <i id="deck-play-icon" class="fas fa-play-circle"></i>
                    </button>
                </div>

            </div>
        </section>

    </main>

    <audio id="bg-music" loop preload="auto">
        <source src="lagu.mp3" type="audio/mpeg">
    </audio>

    <script>
        // CONFIG & STATE
        const VALID_PINS = ['026']
        let currentPin = '';
        let isMusicPlaying = false;

        // Alternate Funny Images for "Ganti Foto Aib" button
        const AIB_PHOTOS = [
            'Anis.png',
        ];
        let photoIndex = 0;

        function createSakuraPetals() {
            const container = document.getElementById('sakura-container');
            const petalIcons = ['🌸', '🌺', '✨', '💖', '🌼', '🌷'];
            
            for (let i = 0; i < 35; i++) {
                const petal = document.createElement('div');
                petal.className = 'sakura-petal';
                petal.innerText = petalIcons[Math.floor(Math.random() * petalIcons.length)];
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = (Math.random() * 4 + 4) + 's';
                petal.style.animationDelay = (Math.random() * 5) + 's';
                petal.style.fontSize = (Math.random() * 14 + 14) + 'px';
                container.appendChild(petal);
            }
        }

        // KEYPAD PIN LOGIC
        function pressKey(num) {
            if (currentPin.length < 3) {
                currentPin += num;
                updatePinDisplay();
            }
            if (currentPin.length === 3) {
                setTimeout(submitPin, 200);
            }
        }

        function clearPin() {
            currentPin = '';
            updatePinDisplay();
            hideError();
        }

        function updatePinDisplay() {
            const slots = document.querySelectorAll('.pin-slot');
            slots.forEach((slot, index) => {
                const dot = slot.querySelector('.pin-dot');
                if (index < currentPin.length) {
                    dot.classList.remove('hidden');
                    slot.classList.add('border-hotpink', 'bg-white');
                } else {
                    dot.classList.add('hidden');
                    slot.classList.remove('border-hotpink', 'bg-white');
                }
            });
        }

        function submitPin() {
            if (VALID_PINS.includes(currentPin)) {
                // PIN CORRECT
                hideError();
                playSuccessEffects();
                transitionToPhase2();
            } else {
                // PIN INCORRECT
                showError();
                const container = document.getElementById('phase-1');
                container.classList.add('animate-shake');
                setTimeout(() => {
                    container.classList.remove('animate-shake');
                    clearPin();
                }, 1000);
            }
        }

        function showError() {
            const err = document.getElementById('error-message');
            err.classList.remove('opacity-0');
        }

        function hideError() {
            const err = document.getElementById('error-message');
            err.classList.add('opacity-0');
        }

        // DRAMATIC FLOWER CELEBRATION EFFECTS
        function playSuccessEffects() {
            // Intensive multi-burst flower & heart confetti celebration
            const duration = 3.5 * 1000;
            const animationEnd = Date.now() + duration;

            // Custom shape emojis for flower burst
            const flowerShapes = ['🌸', '🌺', '💖', '✨', '🌷', '💐'];

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                // Burst from left side
                confetti({
                    particleCount: 25,
                    startVelocity: 40,
                    spread: 80,
                    origin: { x: 0.1, y: 0.6 },
                    colors: ['#FF85A1', '#FFB3C6', '#FFE5EC', '#F7C59F', '#FFC6FF']
                });

                // Burst from right side
                confetti({
                    particleCount: 25,
                    startVelocity: 40,
                    spread: 80,
                    origin: { x: 0.9, y: 0.6 },
                    colors: ['#FF85A1', '#FFB3C6', '#FFE5EC', '#F7C59F', '#FFC6FF']
                });

                // Center fireworks burst
                confetti({
                    particleCount: 15,
                    startVelocity: 30,
                    spread: 360,
                    origin: { x: 0.5, y: 0.4 },
                    colors: ['#FF85A1', '#FF4D6D', '#FFF0F5']
                });
            }, 250);

            // Auto-play music on success if allowed
            startMusic();
        }

        // PHASE TRANSITION LOGIC
        function transitionToPhase2() {
            const phase1 = document.getElementById('phase-1');
            const phase2 = document.getElementById('phase-2');

            phase1.classList.add('opacity-0', 'transition-opacity', 'duration-500');
            setTimeout(() => {
                phase1.classList.add('hidden');
                phase2.classList.remove('hidden');
                phase2.classList.add('flex', 'animate-pop-in');
            }, 500);
        }

        // ENVELOPE OPENING LOGIC
        function openEnvelope() {
            const envelope = document.getElementById('envelope-elem');
            const seal = document.getElementById('envelope-seal');
            
            seal.classList.add('scale-0');
            envelope.classList.add('open');

            // Burst extra confetti from envelope
            confetti({
                particleCount: 80,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#FF85A1', '#FFB3C6', '#FFE5EC']
            });

            // Transition to Phase 4 (Opened Letter)
            setTimeout(() => {
                const phase2 = document.getElementById('phase-2');
                const phase4 = document.getElementById('phase-4');

                phase2.classList.add('opacity-0', 'transition-opacity', 'duration-500');
                setTimeout(() => {
                    phase2.classList.add('hidden');
                    phase2.classList.remove('flex');
                    phase4.classList.remove('hidden');
                }, 500);
            }, 1200);
        }

        // SURPRISE REACTION MODAL
        function triggerSurpriseReaction() {
            document.getElementById('reaction-modal').classList.remove('hidden');
            confetti({
                particleCount: 40,
                spread: 50,
                origin: { y: 0.5 }
            });
        }

        function closeModal() {
            document.getElementById('reaction-modal').classList.add('hidden');
        }

        // CHANGE FOTO AIB LOGIC
        function changePhoto() {
            photoIndex = (photoIndex + 1) % AIB_PHOTOS.length;
            const img = document.getElementById('aib-image');
            img.style.opacity = '0';
            setTimeout(() => {
                img.src = AIB_PHOTOS[photoIndex];
                img.style.opacity = '1';
            }, 200);
        }

        // AUDIO MUSIC CONTROLLER
        function startMusic() {
            const music = document.getElementById('bg-music');
            music.play().then(() => {
                isMusicPlaying = true;
                updateMusicUI();
            }).catch(e => {
                console.log("Audio autoplay restricted by browser.");
            });
        }

        function toggleMusic() {
            const music = document.getElementById('bg-music');
            if (isMusicPlaying) {
                music.pause();
                isMusicPlaying = false;
            } else {
                music.play();
                isMusicPlaying = true;
            }
            updateMusicUI();
        }

        function updateMusicUI() {
            const icon = document.getElementById('music-icon');
            const text = document.getElementById('music-text');
            const deckIcon = document.getElementById('deck-play-icon');

            if (isMusicPlaying) {
                icon.classList.add('fa-compact-disc');
                icon.classList.remove('fa-music');
                text.innerText = 'Musik Nyala 🎵';
                if (deckIcon) deckIcon.className = 'fas fa-pause-circle';
            } else {
                icon.classList.remove('fa-compact-disc');
                icon.classList.add('fa-music');
                text.innerText = 'Putar Musik 🎵';
                if (deckIcon) deckIcon.className = 'fas fa-play-circle';
            }
        }

        // ON PAGE LOAD
        window.onload = function() {
            createSakuraPetals();
        };
    </script>
</body>
</html>
